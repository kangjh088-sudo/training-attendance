<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>교육 출결 관리</title>

<!-- Tailwind (utility CSS, no build step needed) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React 18 + ReactDOM 18 (UMD builds, no bundler needed) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<!-- In-browser JSX transpiler -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- Firebase (compat build -- simple global `firebase` namespace, no bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- Excel export -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

<style>
  body { margin: 0; }
</style>
</head>
<body>
<div id="root"></div>

<!--
  QR code generator, embedded fully offline (no network request at runtime).
  Source: kazuhikoarase/qrcode-generator (MIT License)
  https://github.com/kazuhikoarase/qrcode-generator
-->
<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {

async function getConfig() {
  try {
    const snap = await db.collection("meta").doc("config").get();
    return snap.exists ? snap.data() : {};
  } catch (e) {
    return {};
  }
}
async function setConfig(partial) {
  try {
    await db.collection("meta").doc("config").set(partial, { merge: true });
    return true;
  } catch (e) {
    return false;
  }
}
async function listCourses() {
  try {
    const snap = await db.collection("courses").get();
    const arr = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    return arr;
  } catch (e) {
    return [];
  }
}
async function saveCourse(course) {
  try {
    await db.collection("courses").doc(course.id).set(course);
    return true;
  } catch (e) {
    return false;
  }
}
async function deleteCourseDoc(id) {
  try {
    await db.collection("courses").doc(id).delete();
    return true;
  } catch (e) {
    return false;
  }
}
function attDocId(courseId, employeeId) {
  return `${courseId}_${employeeId}`.replace(/\//g, "_");
}
async function getAttendance(courseId, employeeId) {
  try {
    const snap = await db.collection("attendance").doc(attDocId(courseId, employeeId)).get();
    return snap.exists ? snap.data() : { courseId, employeeId, days: {} };
  } catch (e) {
    return { courseId, employeeId, days: {} };
  }
}
async function setAttendance(courseId, employeeId, days) {
  try {
    await db.collection("attendance").doc(attDocId(courseId, employeeId)).set({ courseId, employeeId, days });
    return true;
  } catch (e) {
    return false;
  }
}
async function listAttendanceForCourse(courseId) {
  try {
    const snap = await db.collection("attendance").where("courseId", "==", courseId).get();
    return snap.docs.map((d) => d.data());
  } catch (e) {
    return [];
  }
}

/* ------------------------------------------------------------------ */
/*  date/time helpers                                                  */
/* ------------------------------------------------------------------ */

const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = (n) => String(n).padStart(2, "0");
const parseYMD = (s) => {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
};
const toYMD = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayStr = () => toYMD(new Date());
const nowTime = () => {
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
};
const dateRange = (start, end) => {
  const out = [];
  let cur = parseYMD(start);
  const endD = parseYMD(end);
  let guard = 0;
  while (cur <= endD && guard < 400) {
    out.push(toYMD(cur));
    cur = new Date(cur.getFullYear(), cur.getMonth(), cur.getDate() + 1);
    guard++;
  }
  return out;
};
const fmtDateLabel = (ymd) => {
  const d = parseYMD(ymd);
  const w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
  return `${d.getMonth() + 1}/${d.getDate()}(${w})`;
};

function Brand() {

      </div>

}

function Btn({ children, onClick, variant = "primary", className = "", disabled }) {
  const base =
    "inline-flex items-center justify-center gap-1.5 rounded-xl px-4 py-2.5 text-sm font-semibold transition active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed";
  const variants = {
    primary: "bg-slate-900 text-white hover:bg-slate-800",
    amber: "bg-amber-500 text-slate-900 hover:bg-amber-400",
    outline: "bg-white text-slate-700 border border-slate-300 hover:bg-slate-100",

function Card({ children, className = "" }) {

}

function Banner({ tone = "error", children, onClose }) {

function QRCodeSVG({ value, size = 220 }) {

    if (!value) return null;

      q.make();
      return q;

      return null;

  if (!qr) {
    return (
      <div className="h-[220px] w-[220px] rounded-lg border border-dashed border-rose-300 bg-rose-50 flex items-center justify-center text-center p-3 text-xs text-rose-500 font-medium">

        rects.push(<rect key={`${r}-${c}`} x={c * cell} y={r * cell} width={cell} height={cell} fill="#0f172a" />);
      }

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width={size} height={size} shapeRendering="crispEdges" className="rounded-lg border border-slate-200 bg-white p-2">
      <rect x="0" y="0" width={size} height={size} fill="#ffffff" />
      {rects}
    </svg>
  );
}

function CourseNotFound({ setView, reload }) {
  const [retrying, setRetrying] = useState(false);
  const [triedOnce, setTriedOnce] = useState(false);
  const retry = async () => {
    setRetrying(true);
    await reload?.();
    setTriedOnce(true);
    setRetrying(false);
  };
  return (
    <div className="max-w-sm mx-auto mt-8">
      <Banner tone="error">과정 정보를 불러오지 못했습니다.</Banner>
      <Card className="p-6 text-center">
        <div className="text-sm text-slate-500 mb-4 leading-relaxed">이 기기에서 아직 강의 목록을 못 불러왔거나, 링크의 과정이 삭제됐을 수 있어요.</div>
        <div className="flex flex-col gap-2">
          <Btn variant="amber" onClick={retry} disabled={retrying}>
            {retrying ? "다시 불러오는 중…" : "다시 불러오기"}
          </Btn>
          <Btn variant="outline" onClick={() => setView({ name: "user-select" })}>
            과정 선택으로 이동

        </div>
        {triedOnce && <div className="text-[11px] text-slate-400 mt-4 leading-relaxed">그래도 안 되면 관리자에게 과정이 등록되어 있는지 확인해달라고 요청해주세요.</div>}
      </Card>
    </div>
  );
}

function App() {
  const [ready, setReady] = useState(false);
  const [courses, setCourses] = useState([]);
  const [view, setView] = useState({ name: "home" });

  const loadCourses = useCallback(async () => {
    const list = await listCourses();
    setCourses(list);
    return list;
  }, []);

  useEffect(() => {
    (async () => {
      const list = await loadCourses();
      let id = null;
      try {
        const params = new URLSearchParams(window.location.search || "");
        if (params.get("course")) id = params.get("course");
      } catch (e) {}
      if (id && list.find((c) => c.id === id)) {
        setView({ name: "user-login", courseId: id });
      }
      setReady(true);
    })();
  }, [loadCourses]);

  const goHome = () => {
    const url = new URL(window.location.href);
    url.search = "";
    window.history.replaceState({}, "", url.toString());
    setView({ name: "home" });
  };

  if (!ready) {
    return (
      <Shell>
        <div className="py-24 text-center text-slate-400 text-sm">불러오는 중…</div>
      </Shell>
    );
  }

  return (
    <Shell>
      <div className="flex items-center justify-between mb-8">
        <button onClick={goHome} className="focus:outline-none">
          <Brand />
        </button>
        {view.name !== "home" && (
          <Btn variant="ghost" onClick={goHome}>
            <Icon>←</Icon> 처음으로
          </Btn>
        )}
      </div>

      {view.name === "home" && <Home setView={setView} />}
      {view.name === "admin-login" && <AdminLogin setView={setView} />}
      {view.name === "admin" && <AdminDashboard courses={courses} setCourses={setCourses} reload={loadCourses} setView={setView} />}
      {view.name === "user-select" && <UserCourseSelect courses={courses} setView={setView} reload={loadCourses} />}
      {view.name === "user-login" && <UserLogin course={courses.find((c) => c.id === view.courseId)} setView={setView} reload={loadCourses} />}
      {view.name === "user-session" && (
        <UserSession course={courses.find((c) => c.id === view.courseId)} empId={view.empId} setView={setView} reload={loadCourses} />
      )}
    </Shell>
  );
}

function AdminLogin({ setView }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const doLogin = async () => {
    try {
      setErr("");
      const typed = String(pw || "").trim();
      if (!typed) {
        setErr("비밀번호를 입력하세요.");
        return;
      }
      setBusy(true);
      const config = await getConfig();
      const stored = String(config.adminPassword ?? DEFAULT_ADMIN_PW).trim();
      if (typed === stored) {
        setView({ name: "admin" });
        return;
      }
      setErr("비밀번호가 올바르지 않습니다. (대소문자와 공백을 확인하세요)");
    } catch (e) {
      setErr("오류가 발생했습니다: " + (e?.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-sm mx-auto mt-8">
      <Card className="p-7">
        <div className="h-11 w-11 rounded-xl bg-slate-900 flex items-center justify-center mb-4 text-xl">
          <Icon>🔒</Icon>
        </div>
        <div className="text-lg font-bold mb-1">관리자 로그인</div>
        <div className="text-sm text-slate-500 mb-5">비밀번호를 입력하세요.</div>
        {err && <Banner tone="error">{err}</Banner>}
        <div className="space-y-4">
          <Field label="비밀번호">
            <input
              autoFocus
              type="password"
              value={pw}
              onChange={(e) => setPw(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && doLogin()}
              className={inputCls}
              placeholder="비밀번호"
            />
          </Field>
          <Btn variant="primary" className="w-full" disabled={busy} onClick={doLogin}>
            {busy ? "확인 중…" : "로그인"}
          </Btn>
        </div>
        <div className="text-[11px] text-slate-400 mt-4 leading-relaxed">
          최초 비밀번호는 <span className="font-mono font-semibold text-slate-500">admin1234</span> 입니다. 로그인 후 변경할 수 있어요.
        </div>
      </Card>
    </div>
  );
}

/* ---- Courses tab ---- */

function CoursesTab({ courses, setCourses, reload }) {
  const [name, setName] = useState("");
  const [start, setStart] = useState("");
  const [end, setEnd] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);
  const [qrFor, setQrFor] = useState(null);

  const [baseUrl, setBaseUrl] = useState("");
  const [baseUrlInput, setBaseUrlInput] = useState("");
  const [baseUrlSaved, setBaseUrlSaved] = useState(false);

  const defaultBaseUrl = () => {
    const url = new URL(window.location.href);
    url.search = "";
    url.hash = "";
    return url.toString();
  };

  useEffect(() => {
    (async () => {
      const config = await getConfig();
      const v = config.baseUrl || defaultBaseUrl();
      setBaseUrl(v);
      setBaseUrlInput(v);
    })();
  }, []);

  const saveBaseUrl = async () => {
    const v = baseUrlInput.trim().replace(/[?#].*$/, "");
    await setConfig({ baseUrl: v });
    setBaseUrl(v);
    setBaseUrlSaved(true);
    setTimeout(() => setBaseUrlSaved(false), 2000);
  };

  const addCourse = async () => {
    try {
      setErr("");
      setOk("");
      if (!name.trim() || !start || !end) {
        setErr("과정명, 시작일, 종료일을 모두 입력하세요.");
        return;
      }
      if (parseYMD(end) < parseYMD(start)) {
        setErr("종료일은 시작일보다 빠를 수 없습니다.");
        return;
      }
      setBusy(true);
      const course = { id: genId(), name: name.trim(), startDate: start, endDate: end, createdAt: Date.now() };
      const next = [course, ...courses];
      setCourses(next);
      const saved = await saveCourse(course);
      if (saved) {
        setOk(`"${course.name}" 과정이 등록되었습니다.`);
      } else {
        setErr("과정은 화면에 추가됐지만 저장소에 저장하지 못했습니다. 다시 시도해주세요.");
      }
      setName("");
      setStart("");
      setEnd("");
    } catch (e) {
      setErr("오류가 발생했습니다: " + (e?.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  const removeCourse = async (id) => {
    if (!window.confirm("이 과정을 삭제할까요? 등록된 출결 기록은 남아있지만 목록에서 사라집니다.")) return;
    const next = courses.filter((c) => c.id !== id);
    setCourses(next);
    const saved = await deleteCourseDoc(id);
    if (!saved) setErr("삭제가 저장소에 반영되지 않았을 수 있습니다. 새로고침 후 다시 확인해주세요.");
  };

  const courseLink = (id) => (baseUrl ? `${baseUrl}?course=${id}` : "");

  return (
    <div className="space-y-8">
      <Card className="p-6 border-amber-200 bg-amber-50/40">
        <div className="text-sm font-bold text-slate-900 mb-1.5 flex items-center gap-1.5">
          <Icon>🔗</Icon> 교육생 접속 기본 주소
        </div>
        <div className="text-xs text-slate-500 mb-3 leading-relaxed">
          지금 이 페이지의 실제 공개 주소가 자동으로 채워져 있어요. 다른 도메인을 쓰고 싶다면 직접 바꿔서 저장할 수 있어요.
        </div>
        <div className="flex flex-wrap items-center gap-2">
          <input value={baseUrlInput} onChange={(e) => setBaseUrlInput(e.target.value)} className={`${inputCls} flex-1 min-w-[240px] font-mono text-xs`} />
          <Btn variant="outline" onClick={saveBaseUrl}>
            저장
          </Btn>
          {baseUrlSaved && <span className="text-xs font-semibold text-emerald-600">저장됨</span>}
        </div>
      </Card>

      <Card className="p-6">
        <div className="text-sm font-bold text-slate-900 mb-4 flex items-center gap-1.5">
          <Icon>➕</Icon> 새 과정 등록
        </div>
        {err && (
          <Banner tone="error" onClose={() => setErr("")}>
            {err}
          </Banner>
        )}
        {ok && (
          <Banner tone="ok" onClose={() => setOk("")}>
            {ok}
          </Banner>
        )}
        <div className="grid sm:grid-cols-4 gap-3 items-end">
          <div className="sm:col-span-2">
            <Field label="과정명">
              <input value={name} onChange={(e) => setName(e.target.value)} className={inputCls} placeholder="예: 2026 신입사원 입문교육" />
            </Field>
          </div>
          <Field label="교육 시작일">
            <input type="date" value={start} onChange={(e) => setStart(e.target.value)} className={inputCls} />
          </Field>
          <Field label="교육 종료일">
            <input type="date" value={end} onChange={(e) => setEnd(e.target.value)} className={inputCls} />
          </Field>
          <div className="sm:col-span-4">
            <Btn variant="amber" disabled={busy} onClick={addCourse}>
              {busy ? "등록 중…" : "과정 등록"}
            </Btn>
          </div>
        </div>
      </Card>

      <div>
        <div className="text-sm font-bold text-slate-900 mb-3">등록된 과정 ({courses.length})</div>
        {courses.length === 0 ? (
          <div className="text-sm text-slate-400 py-10 text-center border border-dashed border-slate-300 rounded-2xl">등록된 과정이 없습니다. 위에서 새 과정을 등록하세요.</div>
        ) : (
          <div className="space-y-3">
            {courses.map((c) => {
              const days = dateRange(c.startDate, c.endDate);
              const link = courseLink(c.id);
              return (
                <Card key={c.id} className="p-5">
                  <div className="flex flex-wrap items-start justify-between gap-4">
                    <div>
                      <div className="font-bold text-slate-900">{c.name}</div>
                      <div className="text-xs text-slate-500 mt-1">
                        {c.startDate} ~ {c.endDate} · 총 {days.length}일
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <Btn variant="outline" onClick={() => setQrFor(qrFor === c.id ? null : c.id)}>
                        QR / 링크
                      </Btn>
                      <Btn variant="danger" onClick={() => removeCourse(c.id)}>
                        🗑️
                      </Btn>
                    </div>
                  </div>
                  {qrFor === c.id && (
                    <div className="mt-4 pt-4 border-t border-slate-100">
                      <div className="flex flex-wrap items-start gap-5">
                        <QRCodeSVG value={link} size={176} />
                        <div className="flex-1 min-w-[220px]">
                          <div className="text-xs font-semibold text-slate-500 mb-1.5">교육생 접속 링크</div>
                          <div className="flex items-center gap-2">
                            <input readOnly value={link} className={`${inputCls} text-xs font-mono`} onFocus={(e) => e.target.select()} />
                            <Btn variant="outline" onClick={() => navigator.clipboard?.writeText(link)}>
                              🔗
                            </Btn>
                          </div>
                          <div className="text-[11px] text-slate-400 mt-2 leading-relaxed">QR코드는 이 브라우저 안에서 직접 그려져요(외부 서버 통신 없음).</div>
                        </div>
                      </div>
                    </div>
                  )}
                </Card>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ---- Attendance tab ---- */

function AttendanceTab({ courses }) {
  const [courseId, setCourseId] = useState(courses[0]?.id || "");
  const [rows, setRows] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (courses.length && !courseId) setCourseId(courses[0].id);
  }, [courses, courseId]);

  const course = courses.find((c) => c.id === courseId);
  const days = useMemo(() => (course ? dateRange(course.startDate, course.endDate) : []), [course]);

  const load = useCallback(async () => {
    if (!course) return;
    setLoading(true);
    const data = await listAttendanceForCourse(course.id);
    data.sort((a, b) => String(a.employeeId).localeCompare(String(b.employeeId)));
    setRows(data);
    setLoading(false);
  }, [course]);

  useEffect(() => {
    load();
  }, [load]);

  const downloadExcel = () => {
    const XLSX = window.XLSX;
    const header = ["사번", ...days.flatMap((d) => [`${fmtDateLabel(d)} 입실`, `${fmtDateLabel(d)} 퇴실`])];
    const body = (rows || []).map((r) => [r.employeeId, ...days.flatMap((d) => [r.days?.[d]?.checkIn || "", r.days?.[d]?.checkOut || ""])]);
    const ws = XLSX.utils.aoa_to_sheet([header, ...body]);
    ws["!cols"] = [{ wch: 12 }, ...days.flatMap(() => [{ wch: 10 }, { wch: 10 }])];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "출결");
    XLSX.writeFile(wb, `${course.name}_출결.xlsx`);
  };

  if (!courses.length) {
    return <div className="text-sm text-slate-400 py-10 text-center border border-dashed border-slate-300 rounded-2xl">먼저 과정을 등록하세요.</div>;
  }

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center gap-3">
        <select value={courseId} onChange={(e) => setCourseId(e.target.value)} className={`${inputCls} max-w-xs`}>
          {courses.map((c) => (
            <option key={c.id} value={c.id}>
              {c.name}
            </option>
          ))}
        </select>
        <Btn variant="outline" onClick={load} disabled={loading}>
          새로고침
        </Btn>
        <div className="flex-1" />
        <Btn variant="success" onClick={downloadExcel} disabled={!rows || rows.length === 0}>
          ⬇️ 엑셀 다운로드
        </Btn>
      </div>

      <Card className="overflow-x-auto">
        {loading ? (
          <div className="p-10 text-center text-sm text-slate-400">불러오는 중…</div>
        ) : !rows || rows.length === 0 ? (
          <div className="p-10 text-center text-sm text-slate-400">아직 출결 기록이 없습니다.</div>
        ) : (
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-200 bg-slate-50">
                <th className="text-left font-semibold text-slate-500 px-4 py-3 whitespace-nowrap">사번</th>
                {days.map((d, i) => (
                  <th key={d} className="text-center font-semibold text-slate-500 px-4 py-3 whitespace-nowrap">
                    {i + 1}일차 <span className="text-slate-400 font-normal">({fmtDateLabel(d)})</span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.employeeId} className="border-b border-slate-100 last:border-0">
                  <td className="px-4 py-3 font-semibold text-slate-800 whitespace-nowrap">{r.employeeId}</td>
                  {days.map((d) => {
                    const rec = r.days?.[d];
                    return (
                      <td key={d} className="px-4 py-3 text-center whitespace-nowrap">
                        {rec?.checkIn || rec?.checkOut ? (
                          <span className="text-xs text-slate-600">
                            <span className="text-emerald-600 font-semibold">{rec?.checkIn || "-"}</span>
                            {" ~ "}
                            <span className="text-rose-500 font-semibold">{rec?.checkOut || "-"}</span>
                          </span>
                        ) : (
                          <span className="text-slate-300">-</span>
                        )}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>
    </div>
  );
}

/* ---- Password tab ---- */

function PasswordTab() {
  const [cur, setCur] = useState("");
  const [next, setNext] = useState("");
  const [confirm, setConfirm] = useState("");
  const [err, setErr] = useState("");
  const [ok, setOk] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    try {
      setErr("");
      setOk("");
      const config = await getConfig();
      const stored = String(config.adminPassword ?? DEFAULT_ADMIN_PW).trim();
      if (cur.trim() !== stored) {
        setErr("현재 비밀번호가 올바르지 않습니다.");
        return;
      }
      if (next.length < 4) {
        setErr("새 비밀번호는 4자 이상이어야 합니다.");
        return;
      }
      if (next !== confirm) {
        setErr("새 비밀번호가 일치하지 않습니다.");
        return;
      }
      setBusy(true);
      const saved = await setConfig({ adminPassword: next });
      if (saved) {
        setOk("비밀번호가 변경되었습니다.");
        setCur("");
        setNext("");
        setConfirm("");
      } else {
        setErr("저장소에 저장하지 못했습니다. 잠시 후 다시 시도해주세요.");
      }
    } catch (e) {
      setErr("오류가 발생했습니다: " + (e?.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="max-w-sm">
      <Card className="p-6">
        {err && (
          <Banner tone="error" onClose={() => setErr("")}>
            {err}
          </Banner>
        )}
        {ok && (
          <Banner tone="ok" onClose={() => setOk("")}>
            {ok}
          </Banner>
        )}
        <div className="space-y-4">
          <Field label="현재 비밀번호">
            <input type="password" value={cur} onChange={(e) => setCur(e.target.value)} className={inputCls} />
          </Field>
          <Field label="새 비밀번호">
            <input type="password" value={next} onChange={(e) => setNext(e.target.value)} className={inputCls} />
          </Field>
          <Field label="새 비밀번호 확인">
            <input type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} className={inputCls} />
          </Field>
          <Btn disabled={busy} onClick={submit}>
            {busy ? "변경 중…" : "비밀번호 변경"}
          </Btn>
        </div>
      </Card>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  User: pick a course                                                */
/* ------------------------------------------------------------------ */

function UserCourseSelect({ courses, setView, reload }) {
  const [retrying, setRetrying] = useState(false);
  if (!courses.length) {
    return (
      <div className="max-w-sm mx-auto mt-8 text-center">
        <div className="text-sm text-slate-400 py-10 border border-dashed border-slate-300 rounded-2xl mb-3">아직 등록된 교육 과정이 없습니다.</div>
        <Btn
          variant="outline"
          disabled={retrying}
          onClick={async () => {
            setRetrying(true);
            await reload?.();
            setRetrying(false);
          }}
        >
          {retrying ? "다시 불러오는 중…" : "다시 불러오기"}
        </Btn>
      </div>
    );
  }
  return (
    <div>
      <div className="text-sm font-bold text-slate-500 mb-4">참여할 과정을 선택하세요</div>
      <div className="grid sm:grid-cols-2 gap-3">
        {courses.map((c) => {
          const days = dateRange(c.startDate, c.endDate);
          return (
            <button key={c.id} className="text-left" onClick={() => setView({ name: "user-login", courseId: c.id })}>
              <Card className="p-5 h-full hover:border-amber-400 hover:shadow-md transition">
                <div className="font-bold text-slate-900">{c.name}</div>
                <div className="text-xs text-slate-500 mt-1 mb-3">
                  {c.startDate} ~ {c.endDate} · 총 {days.length}일
                </div>
                <DayPills days={days} dayData={{}} size="sm" />
              </Card>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  User: enter employee id                                            */
/* ------------------------------------------------------------------ */

function UserLogin({ course, setView, reload }) {
  const [empId, setEmpId] = useState("");
  const [err, setErr] = useState("");

  if (!course) {
    return <CourseNotFound setView={setView} reload={reload} />;
  }

  const days = dateRange(course.startDate, course.endDate);

  const submit = () => {
    if (!empId.trim()) {
      setErr("사번을 입력하세요.");
      return;
    }
    setView({ name: "user-session", courseId: course.id, empId: empId.trim() });
  };

  return (
    <div className="max-w-sm mx-auto mt-6">
      <div className="text-center mb-6">
        <div className="text-xs font-bold text-amber-600 tracking-wide mb-1">
          {course.startDate} ~ {course.endDate}
        </div>
        <div className="text-xl font-extrabold text-slate-900 tracking-tight">{course.name}</div>
      </div>
      <Card className="p-6">
        {err && (
          <Banner tone="error" onClose={() => setErr("")}>
            {err}
          </Banner>
        )}
        <div className="space-y-4">
          <Field label="사번">
            <input
              autoFocus
              inputMode="numeric"
              value={empId}
              onChange={(e) => setEmpId(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submit()}
              className={`${inputCls} text-center text-lg font-bold tracking-wide`}
              placeholder="사번 입력"
            />
          </Field>
          <Btn variant="amber" className="w-full" onClick={submit}>
            확인
          </Btn>
        </div>
        <div className="mt-5 pt-4 border-t border-slate-100">
          <div className="text-xs font-semibold text-slate-400 mb-2">교육 일정 ({days.length}일)</div>
          <DayPills days={days} dayData={{}} size="sm" />
        </div>
      </Card>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  User: check-in / check-out session                                 */
/* ------------------------------------------------------------------ */

function UserSession({ course, empId, setView, reload }) {
  const [rec, setRec] = useState(null);
  const [loading, setLoading] = useState(true);
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const days = useMemo(() => (course ? dateRange(course.startDate, course.endDate) : []), [course]);
  const today = todayStr();
  const inRange = course && today >= course.startDate && today <= course.endDate;
  const beforeStart = course && today < course.startDate;

  const load = useCallback(async () => {
    if (!course) return;
    setLoading(true);
    const data = await getAttendance(course.id, empId);
    setRec(data);
    setLoading(false);
  }, [course, empId]);

  useEffect(() => {
    load();
  }, [load]);

  if (!course) {
    return <CourseNotFound setView={setView} reload={reload} />;
  }

  const todayRec = rec?.days?.[today];

  const doCheck = async (type) => {
    setBusy(true);
    setMsg(null);
    const fresh = await getAttendance(course.id, empId);
    const dayData = { ...(fresh.days?.[today] || {}) };
    if (type === "in") {
      if (dayData.checkIn) {
        setMsg({ tone: "error", text: "이미 입실 처리되었습니다." });
        setBusy(false);
        return;
      }
      dayData.checkIn = nowTime();
    } else {
      if (!dayData.checkIn) {
        setMsg({ tone: "error", text: "입실 기록이 없습니다. 먼저 입실해주세요." });
        setBusy(false);
        return;
      }
      if (dayData.checkOut) {
        setMsg({ tone: "error", text: "이미 퇴실 처리되었습니다." });
        setBusy(false);
        return;
      }
      dayData.checkOut = nowTime();
    }
    const nextDays = { ...(fresh.days || {}), [today]: dayData };
    await setAttendance(course.id, empId, nextDays);
    setRec({ employeeId: empId, days: nextDays });
    setMsg({ tone: "ok", text: type === "in" ? `입실 완료 (${dayData.checkIn})` : `퇴실 완료 (${dayData.checkOut})` });
    setBusy(false);
  };

  return (
    <div className="max-w-md mx-auto">
      <div className="flex items-center justify-between mb-5">
        <div>
          <div className="text-xs font-bold text-amber-600 tracking-wide mb-0.5">{course.name}</div>
          <div className="text-lg font-extrabold text-slate-900">사번 {empId}</div>
        </div>
        <Btn variant="ghost" onClick={() => setView({ name: "user-login", courseId: course.id })}>
          다른 사번
        </Btn>
      </div>

      {msg && (
        <Banner tone={msg.tone} onClose={() => setMsg(null)}>
          {msg.text}
        </Banner>
      )}

      {!inRange && (
        <Banner tone="info">
          {beforeStart ? "교육이 아직 시작되지 않았습니다." : "교육 기간이 종료되었습니다."} (오늘: {today})
        </Banner>
      )}

      <Card className="p-6 mb-5">
        <div className="text-xs font-semibold text-slate-400 mb-3">오늘 · {fmtDateLabel(today)}</div>
        {loading ? (
          <div className="py-8 text-center text-sm text-slate-400">불러오는 중…</div>
        ) : (
          <>
            <div className="flex items-center justify-center gap-4 mb-5">
              <div className="text-center flex-1">
                <div className="text-[11px] font-semibold text-slate-400 mb-1">입실</div>
                <div className={`text-2xl font-extrabold ${todayRec?.checkIn ? "text-emerald-600" : "text-slate-300"}`}>{todayRec?.checkIn || "--:--"}</div>
              </div>
              <div className="h-10 w-px bg-slate-200" />
              <div className="text-center flex-1">
                <div className="text-[11px] font-semibold text-slate-400 mb-1">퇴실</div>
                <div className={`text-2xl font-extrabold ${todayRec?.checkOut ? "text-rose-500" : "text-slate-300"}`}>{todayRec?.checkOut || "--:--"}</div>
              </div>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <Btn variant="success" className="py-3.5" disabled={!inRange || busy || !!todayRec?.checkIn} onClick={() => doCheck("in")}>
                🚪 입실하기
              </Btn>
              <Btn variant="danger" className="py-3.5 !bg-rose-500 !text-white hover:!bg-rose-400" disabled={!inRange || busy || !todayRec?.checkIn || !!todayRec?.checkOut} onClick={() => doCheck("out")}>
                🔒 퇴실하기
              </Btn>
            </div>
          </>
        )}
      </Card>

      <Card className="p-6">
        <div className="flex items-center justify-between mb-3">
          <div className="text-xs font-semibold text-slate-400">내 출결 이력</div>
          <DayPills days={days} dayData={rec?.days || {}} size="sm" />
        </div>
        <div className="divide-y divide-slate-100">
          {days.map((d, i) => {
            const r = rec?.days?.[d];
            return (
              <div key={d} className="flex items-center justify-between py-2.5 text-sm">
                <span className="text-slate-500 font-medium">
                  {i + 1}일차 <span className="text-slate-400 font-normal">({fmtDateLabel(d)})</span>
                </span>
                <span className="font-semibold">
                  {r?.checkIn || r?.checkOut ? (
                    <>
                      <span className="text-emerald-600">{r?.checkIn || "-"}</span>
                      <span className="text-slate-300 mx-1">~</span>
                      <span className="text-rose-500">{r?.checkOut || "-"}</span>
                    </>
                  ) : (
                    <span className="text-slate-300">미기록</span>
                  )}
                </span>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
